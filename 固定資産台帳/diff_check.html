<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固定資産台帳 更新ツール 差異チェック</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-start justify-center p-4 py-6">

  <div class="w-full max-w-2xl">

    <div class="mb-4">
      <h1 class="text-lg font-bold text-slate-800">固定資産台帳 更新ツール 差異チェック</h1>
      <p class="text-slate-400 text-xs mt-1">※このツールはブラウザ内で処理します。ファイルの内容は外部に送信されません。</p>
    </div>

    <p class="text-slate-500 text-sm mb-3">2つのマスタファイル（更新済み資産台帳）を比較し、資産台帳シート・償却シミュレーションシート・案件一覧シートそれぞれでキー列により行を対応付け、確認列の一致状況を確認します。</p>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200">
      <div class="p-6 space-y-4">

        <!-- File A -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            VBA版ファイル <span class="text-red-500">*</span>
          </label>
          <label for="fileAInput" id="fileARow"
            class="flex items-center gap-3 border-2 border-dashed border-slate-300 rounded-lg px-4 py-3 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all">
            <svg class="w-5 h-5 text-slate-400 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <span id="fileALabel" class="text-slate-400 text-sm flex-1 truncate">ファイルを選択...</span>
            <span class="text-indigo-600 text-sm font-medium flex-shrink-0">選択</span>
          </label>
          <input type="file" id="fileAInput" accept=".xlsx,.xls" class="hidden">
        </div>

        <!-- File B -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            WEBツール版ファイル <span class="text-red-500">*</span>
          </label>
          <label for="fileBInput" id="fileBRow"
            class="flex items-center gap-3 border-2 border-dashed border-slate-300 rounded-lg px-4 py-3 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all">
            <svg class="w-5 h-5 text-slate-400 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <span id="fileBLabel" class="text-slate-400 text-sm flex-1 truncate">ファイルを選択...</span>
            <span class="text-indigo-600 text-sm font-medium flex-shrink-0">選択</span>
          </label>
          <input type="file" id="fileBInput" accept=".xlsx,.xls" class="hidden">
        </div>

        <!-- シート別キー列・確認列設定 -->
        <div class="space-y-3" id="sheetKeyCols">
          <!-- JS で動的生成 -->
        </div>

        <button id="execBtn" disabled
          class="w-full py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          比較実行
        </button>

        <!-- Error -->
        <div id="errorBox" style="display:none" class="flex items-start gap-3 bg-red-50 border border-red-200 rounded-lg px-4 py-3">
          <svg class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <p id="errorMsg" class="text-red-800 text-sm"></p>
        </div>

        <!-- Result -->
        <div id="resultBox" style="display:none" class="space-y-3">
          <div class="space-y-2" id="sheetSummaries"></div>
          <div class="flex gap-2">
            <button id="downloadBtn"
              class="flex-1 py-2.5 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors text-sm">
              結果をExcelでダウンロード
            </button>
          </div>
          <pre id="detailPre" class="bg-slate-900 text-slate-100 text-xs rounded-lg p-4 overflow-auto max-h-96 whitespace-pre"></pre>
        </div>

      </div>
    </div>

  </div>

<script>
  // =====================================================
  // 共通ユーティリティ
  // =====================================================
  function colLetterToIndex(letter) {
    let n = 0;
    letter = letter.trim().toUpperCase();
    for (let i = 0; i < letter.length; i++) {
      n = n * 26 + (letter.charCodeAt(i) - 64);
    }
    return n - 1;
  }

  function cellText(cell) {
    if (!cell) return '';
    if (cell.t === 'n') return String(cell.v);
    if (cell.v === undefined || cell.v === null) return '';
    if (cell.v instanceof Date) return cell.v.toISOString();
    return String(cell.v).trim();
  }

  // "20260525" のようなテキスト日付と、Dateオブジェクトの日付表現を揃える(YYYYMMDD)
  function normDate(v) {
    if (/^\d{8}$/.test(v)) return v;
    const m = /^\d{4}-\d{2}-\d{2}T/.exec(v);
    if (m) {
      const d = new Date(v);
      d.setUTCHours(d.getUTCHours() + 9);
      const y = d.getUTCFullYear();
      const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
      const da = String(d.getUTCDate()).padStart(2, '0');
      return `${y}${mo}${da}`;
    }
    return v;
  }

  // Excelの日付シリアル値(生の数値)をYYYYMMDDに変換する
  function serialToYmd(num) {
    const ms = Date.UTC(1899, 11, 30) + Math.round(num) * 86400000;
    const d = new Date(ms);
    const y = d.getUTCFullYear();
    const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
    const da = String(d.getUTCDate()).padStart(2, '0');
    return `${y}${mo}${da}`;
  }

  // 確認列の値比較。片方が日付書式と認識されてDateオブジェクト(ISO文字列)になり、
  // もう片方が生のExcelシリアル値のまま読み込まれていても、同じ日付を指していれば一致とみなす。
  // (両方とも日付らしいときだけシリアル変換を行い、無関係な数値同士を誤って一致させないようにする)
  function valuesEqual(av, bv) {
    if (av === bv) return true;
    if (normDate(av) === normDate(bv)) return true;
    const aIsIso = /^\d{4}-\d{2}-\d{2}T/.test(av);
    const bIsIso = /^\d{4}-\d{2}-\d{2}T/.test(bv);
    const aIsNum = /^\d+(\.\d+)?$/.test(av);
    const bIsNum = /^\d+(\.\d+)?$/.test(bv);
    if (aIsIso && bIsNum) return normDate(av) === serialToYmd(Number(bv));
    if (bIsIso && aIsNum) return normDate(bv) === serialToYmd(Number(av));
    return false;
  }

  function readWorkbook(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array', cellDates: true });
          resolve(wb);
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsArrayBuffer(file);
    });
  }

  // シートの!ref(dimension)は末尾に空行が残っていても縮まらないことがあるため、
  // 実際にデータが入っている最終行を後ろから走査して求める
  function findActualLastRow(ws, ref) {
    for (let r = ref.e.r; r >= 1; r--) {
      for (let c = ref.s.c; c <= ref.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        if (cell && cell.v !== undefined && cell.v !== null && cell.v !== '') return r;
      }
    }
    return 0; // ヘッダー行しかデータがない
  }

  function buildKey(vals, keyIdx) {
    return JSON.stringify(keyIdx.map(i => normDate(vals[i] ?? '')));
  }

  function groupByKey(rows, keyIdx) {
    const m = new Map();
    for (const row of rows) {
      const key = buildKey(row.vals, keyIdx);
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(row);
    }
    return m;
  }

  function setupDropZone(row, setFile) {
    ['dragenter', 'dragover'].forEach(evt => {
      row.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        row.classList.add('border-indigo-400', 'bg-indigo-50');
      });
    });
    ['dragleave', 'dragend'].forEach(evt => {
      row.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        row.classList.remove('border-indigo-400', 'bg-indigo-50');
      });
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove('border-indigo-400', 'bg-indigo-50');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) setFile(file);
    });
  }

  // 指定行(0始まり)・キー列で行を対応付け、確認列の一致状況を集計する
  function compareRows(rowsA, rowsB, keyIdx, checkIdx, keyLetters, checkLetters) {
    const groupsA = groupByKey(rowsA, keyIdx);
    const groupsB = groupByKey(rowsB, keyIdx);
    const allKeys = new Set([...groupsA.keys(), ...groupsB.keys()]);

    let matchedPairs = 0;
    let allMatch = 0;
    const perColMismatch = checkLetters.map(() => 0);
    let unmatchedA = 0, unmatchedB = 0;
    const mismatches = [];

    allKeys.forEach(key => {
      const gA = groupsA.get(key) || [];
      const gB = groupsB.get(key) || [];
      const pairCount = Math.min(gA.length, gB.length);
      for (let i = 0; i < pairCount; i++) {
        matchedPairs++;
        const a = gA[i], b = gB[i];
        let rowAllMatch = true;
        const checkVals = [];
        checkIdx.forEach((ci, k) => {
          const av = a.vals[ci] ?? '';
          const bv = b.vals[ci] ?? '';
          const isMatch = valuesEqual(av, bv);
          if (!isMatch) { rowAllMatch = false; perColMismatch[k]++; }
          checkVals.push({ letter: checkLetters[k], av, bv, match: isMatch });
        });
        if (rowAllMatch) {
          allMatch++;
        } else {
          mismatches.push({
            aRow: a.excelRow,
            bRow: b.excelRow,
            keyVals: keyLetters.map((l, idx) => ({ letter: l, val: a.vals[keyIdx[idx]] })),
            checkVals: checkVals.filter(c => !c.match),
          });
        }
      }
      unmatchedA += gA.length - pairCount;
      unmatchedB += gB.length - pairCount;
    });

    return { rowsACount: rowsA.length, rowsBCount: rowsB.length, matchedPairs, allMatch, perColMismatch, unmatchedA, unmatchedB, mismatches };
  }

  // =====================================================
  // 資産台帳・償却シミュレーション の2シート比較
  // =====================================================
  (function () {
    const SHEETS = [
      { name: '資産台帳',         defaultKey: 'D,BG', defaultCheck: 'F,H,I,AA,AE,AF,AH' },
      { name: '償却シミュレーション', defaultKey: 'C,X',  defaultCheck: 'V,W' },
      { name: '案件一覧',         defaultKey: 'B,F',  defaultCheck: 'C,D,M,P,Q' },
    ];

    const fileAInput = document.getElementById('fileAInput');
    const fileBInput = document.getElementById('fileBInput');
    const fileALabel = document.getElementById('fileALabel');
    const fileBLabel = document.getElementById('fileBLabel');
    const execBtn = document.getElementById('execBtn');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');
    const sheetSummaries = document.getElementById('sheetSummaries');
    const detailPre = document.getElementById('detailPre');
    const downloadBtn = document.getElementById('downloadBtn');
    const sheetKeyCols = document.getElementById('sheetKeyCols');

    const fileARow = document.getElementById('fileARow');
    const fileBRow = document.getElementById('fileBRow');

    // シート別キー列・確認列入力欄を生成
    const keyInputs = {};
    const checkInputs = {};
    SHEETS.forEach(s => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="text-xs font-semibold text-slate-700 mb-1">${s.name}</div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">キー列</label>
            <input type="text" value="${s.defaultKey}"
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">確認列</label>
            <input type="text" value="${s.defaultCheck}"
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>`;
      sheetKeyCols.appendChild(wrap);
      const inputs = wrap.querySelectorAll('input');
      keyInputs[s.name] = inputs[0];
      checkInputs[s.name] = inputs[1];
    });

    let fileA = null, fileB = null;
    let lastResults = []; // [{ sheetName, keyLetters, checkLetters, ...compareRows結果 }]

    function setFileA(file) {
      if (file && !/\.(xlsx|xls)$/i.test(file.name)) return;
      fileA = file || null;
      fileALabel.textContent = fileA ? fileA.name : 'ファイルを選択...';
      fileALabel.className = fileA ? 'text-slate-700 text-sm flex-1 truncate font-medium' : 'text-slate-400 text-sm flex-1 truncate';
      updateExecState();
    }
    function setFileB(file) {
      if (file && !/\.(xlsx|xls)$/i.test(file.name)) return;
      fileB = file || null;
      fileBLabel.textContent = fileB ? fileB.name : 'ファイルを選択...';
      fileBLabel.className = fileB ? 'text-slate-700 text-sm flex-1 truncate font-medium' : 'text-slate-400 text-sm flex-1 truncate';
      updateExecState();
    }

    fileAInput.addEventListener('change', () => setFileA(fileAInput.files[0]));
    fileBInput.addEventListener('change', () => setFileB(fileBInput.files[0]));
    setupDropZone(fileARow, setFileA);
    setupDropZone(fileBRow, setFileB);

    function updateExecState() {
      execBtn.disabled = !(fileA && fileB);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.style.display = 'flex';
      resultBox.style.display = 'none';
    }

    function loadRowsFromSheet(wb, sheetName, colIndices) {
      const ws = wb.Sheets[sheetName];
      if (!ws) throw new Error(`シート「${sheetName}」が見つかりません。`);
      if (!ws['!ref']) throw new Error(`シート「${sheetName}」にデータがありません。`);
      const ref = XLSX.utils.decode_range(ws['!ref']);
      const lastRow = findActualLastRow(ws, ref);
      const rows = [];
      for (let r = 1; r <= lastRow; r++) { // 1行目はヘッダー
        const vals = [];
        const maxCol = Math.max(ref.e.c, ...colIndices);
        for (let c = 0; c <= maxCol; c++) {
          vals.push(cellText(ws[XLSX.utils.encode_cell({ r, c })]));
        }
        rows.push({ excelRow: r + 1, vals });
      }
      return rows;
    }

    function compareSheet(wbA, wbB, sheetName, keyLetters, checkLetters) {
      const keyIdx = keyLetters.map(colLetterToIndex);
      const checkIdx = checkLetters.map(colLetterToIndex);
      const allIdx = [...keyIdx, ...checkIdx];

      const rowsA = loadRowsFromSheet(wbA, sheetName, allIdx);
      const rowsB = loadRowsFromSheet(wbB, sheetName, allIdx);

      const r = compareRows(rowsA, rowsB, keyIdx, checkIdx, keyLetters, checkLetters);
      return { sheetName, keyLetters, checkLetters, ...r };
    }

    function runCompare() {
      errorBox.style.display = 'none';

      Promise.all([readWorkbook(fileA), readWorkbook(fileB)]).then(([wbA, wbB]) => {
        const results = [];
        for (const s of SHEETS) {
          const keyLetters = keyInputs[s.name].value.split(',').map(v => v.trim()).filter(Boolean);
          const checkLetters = checkInputs[s.name].value.split(',').map(v => v.trim()).filter(Boolean);
          if (!keyLetters.length || !checkLetters.length) throw new Error(`${s.name}のキー列・確認列を指定してください。`);
          results.push(compareSheet(wbA, wbB, s.name, keyLetters, checkLetters));
        }
        lastResults = results;

        sheetSummaries.innerHTML = results.map(r => `
          <div class="bg-slate-50 rounded-lg p-4 text-sm text-slate-700">
            <div class="font-semibold text-slate-800 mb-2">${r.sheetName}<span class="text-xs font-normal text-slate-400 ml-2">キー列: ${r.keyLetters.join(',')} / 確認列: ${r.checkLetters.join(',')}</span></div>
            <div class="grid grid-cols-2 gap-2">
              <div>VBA総行数: <b>${r.rowsACount}</b></div>
              <div>WEB総行数: <b>${r.rowsBCount}</b></div>
              <div>対応付け成功: <b>${r.matchedPairs}</b></div>
              <div>完全一致: <b class="text-emerald-600">${r.allMatch}</b></div>
              <div>不一致: <b class="text-red-600">${r.mismatches.length}</b></div>
              <div>キー対応なし VBA/WEB: <b>${r.unmatchedA} / ${r.unmatchedB}</b></div>
            </div>
          </div>`).join('');

        const detailLines = [];
        results.forEach(r => {
          if (!r.mismatches.length) return;
          detailLines.push(`■ ${r.sheetName}`);
          r.mismatches.forEach(m => {
            const keyDesc = m.keyVals.map(k => `${k.letter}=${k.val}`).join(' ');
            const checkDesc = m.checkVals.map(c => `${c.letter}: VBA="${c.av}" / WEB="${c.bv}"`).join(' , ');
            detailLines.push(`  VBA行${m.aRow}/WEB行${m.bRow}  ${keyDesc}  |  ${checkDesc}`);
          });
        });
        detailPre.textContent = detailLines.length ? detailLines.join('\n') : '(不一致なし)';
        resultBox.style.display = 'block';
      }).catch(err => {
        showError('比較中にエラーが発生しました: ' + err.message);
      });
    }

    execBtn.addEventListener('click', runCompare);

    downloadBtn.addEventListener('click', () => {
      const wb = XLSX.utils.book_new();

      const summaryRows = [['シート', '項目', '値']];
      lastResults.forEach(r => {
        summaryRows.push(
          [r.sheetName, 'キー列', r.keyLetters.join(',')],
          [r.sheetName, '確認列', r.checkLetters.join(',')],
          [r.sheetName, 'VBA総行数', r.rowsACount],
          [r.sheetName, 'WEB総行数', r.rowsBCount],
          [r.sheetName, '対応付けできた行(ペア)数', r.matchedPairs],
          [r.sheetName, '確認列すべて一致', r.allMatch],
          [r.sheetName, 'キー対応なし(VBA側のみ)', r.unmatchedA],
          [r.sheetName, 'キー対応なし(WEB側のみ)', r.unmatchedB],
          [r.sheetName, '不一致行数', r.mismatches.length],
        );
      });
      const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
      XLSX.utils.book_append_sheet(wb, summaryWs, 'サマリー');

      lastResults.forEach(r => {
        const header = ['VBA行', 'WEB行', ...r.keyLetters, '不一致列', 'VBA値', 'WEB値'];
        const rows = [];
        r.mismatches.forEach(m => {
          m.checkVals.forEach(c => {
            rows.push([m.aRow, m.bRow, ...m.keyVals.map(k => k.val), c.letter, c.av, c.bv]);
          });
        });
        const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
        XLSX.utils.book_append_sheet(wb, ws, `${r.sheetName}_不一致`.slice(0, 31));
      });

      XLSX.writeFile(wb, '差異チェック結果_固定資産台帳.xlsx');
    });
  })();
</script>
</body>
</html>
