<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資産台帳 変換ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-lg">

    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">資産台帳 変換ツール</h1>
      <p class="text-slate-500 text-sm mt-1">Excelファイルのレイアウトを自動整形します</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200">
      <div class="p-8 space-y-4">

        <!-- Drop zone -->
        <div
          id="dropZone"
          class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition-all select-none"
        >
          <svg class="w-10 h-10 text-slate-400 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          <p class="text-slate-600 font-medium">ここにファイルをドロップ</p>
          <p class="text-slate-400 text-sm mt-1">または</p>
          <label class="mt-3 inline-block cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
            ファイルを選択
            <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
          </label>
          <p class="text-slate-300 text-xs mt-3">.xlsx / .xls</p>
        </div>

        <!-- Selected file info -->
        <div id="fileInfo" style="display:none" class="flex items-center gap-3 bg-slate-50 rounded-lg px-4 py-3">
          <svg class="w-5 h-5 text-indigo-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          <span id="fileNameLabel" class="text-slate-700 text-sm font-medium truncate flex-1"></span>
          <button id="clearBtn" class="text-slate-400 hover:text-slate-600 flex-shrink-0 p-1 rounded">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Process button -->
        <button
          id="processBtn"
          disabled
          class="w-full py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          変換を実行
        </button>

        <!-- Status: success -->
        <div id="statusSuccess" style="display:none" class="flex items-start gap-3 bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-3">
          <svg class="w-5 h-5 text-emerald-500 flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          <div>
            <p class="text-emerald-800 font-medium text-sm">変換が完了しました</p>
            <p id="statusDetail" class="text-emerald-600 text-xs mt-0.5"></p>
          </div>
        </div>

        <!-- Status: error -->
        <div id="statusError" style="display:none" class="flex items-start gap-3 bg-red-50 border border-red-200 rounded-lg px-4 py-3">
          <svg class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <p id="errorMsg" class="text-red-800 text-sm"></p>
        </div>

        <!-- Download -->
        <div id="downloadArea" style="display:none">
          <a id="dlProcessed" href="#"
            class="flex items-center justify-center gap-2 w-full py-3 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
            </svg>
            変換済みファイルをダウンロード
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    const dropZone      = document.getElementById('dropZone');
    const fileInput     = document.getElementById('fileInput');
    const fileInfo      = document.getElementById('fileInfo');
    const fileNameLabel = document.getElementById('fileNameLabel');
    const clearBtn      = document.getElementById('clearBtn');
    const processBtn    = document.getElementById('processBtn');
    const statusSuccess = document.getElementById('statusSuccess');
    const statusDetail  = document.getElementById('statusDetail');
    const statusError   = document.getElementById('statusError');
    const errorMsg      = document.getElementById('errorMsg');
    const downloadArea  = document.getElementById('downloadArea');
    const dlProcessed   = document.getElementById('dlProcessed');

    let selectedFile = null;

    // --- File selection ---
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) setFile(e.target.files[0]);
    });

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
    });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
      const f = e.dataTransfer.files[0];
      if (f && /\.(xlsx|xls)$/i.test(f.name)) {
        setFile(f);
      } else {
        showError('Excelファイル（.xlsx / .xls）を選択してください。');
      }
    });

    function setFile(f) {
      selectedFile = f;
      fileNameLabel.textContent = f.name;
      fileInfo.style.display = 'flex';
      processBtn.disabled = false;
      reset();
    }

    clearBtn.addEventListener('click', () => {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.style.display = 'none';
      processBtn.disabled = true;
      reset();
    });

    function reset() {
      statusSuccess.style.display = 'none';
      statusError.style.display = 'none';
      downloadArea.style.display = 'none';
      if (dlProcessed._objUrl) { URL.revokeObjectURL(dlProcessed._objUrl); dlProcessed._objUrl = null; }
    }

    function showError(msg) {
      statusSuccess.style.display = 'none';
      errorMsg.textContent = msg;
      statusError.style.display = 'flex';
    }

    function showSuccess(detail) {
      statusError.style.display = 'none';
      statusDetail.textContent = detail;
      statusSuccess.style.display = 'flex';
    }

    // --- Process ---
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      processBtn.disabled = true;
      processBtn.textContent = '処理中...';
      reset();

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const bytes = new Uint8Array(arrayBuffer);
        const result = processAssetLedger(bytes);

        const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
        const outName = baseName + 'フォーマット調整.xls';

        const blob = new Blob([result.output], {
          type: 'application/vnd.ms-excel'
        });
        const url = URL.createObjectURL(blob);
        dlProcessed._objUrl = url;
        dlProcessed.href = url;
        dlProcessed.download = outName;

        showSuccess(`変換完了 — データ ${result.rowCount} 行 → ${outName}　（読込形式: ${result.fmt}）`);
        downloadArea.style.display = 'block';

      } catch (e) {
        showError('処理エラー: ' + e.message);
      } finally {
        processBtn.disabled = false;
        processBtn.textContent = '変換を実行';
      }
    });

    // =====================================================
    // 資産台帳 変換ロジック
    // セルオブジェクトを直接操作することで文字化けを防ぐ
    // =====================================================

    // ファイルのバイト署名でフォーマットを判定し、CP932(Shift-JIS)を明示して読み込む
    // 戻り値: { wb, fmt }
    function readWorkbook(bytes) {
      const b0 = bytes[0], b1 = bytes[1], b2 = bytes[2];

      // ZIP署名 (PK) → .xlsx バイナリ。CP932 ヒントを明示
      if (b0 === 0x50 && b1 === 0x4B) {
        return { fmt: 'xlsx(ZIP)',
                 wb: XLSX.read(bytes, { type: 'array', cellDates: true, codepage: 932 }) };
      }

      // OLE2署名 → .xls バイナリ。CP932 明示
      if (b0 === 0xD0 && b1 === 0xCF) {
        return { fmt: 'xls(OLE2)',
                 wb: XLSX.read(bytes, { type: 'array', cellDates: true, codepage: 932 }) };
      }

      // ---- テキスト系（CSV / XML SpreadsheetML）----
      // BOM がある場合のみそのコードを使用し、なければ CP932(Shift-JIS) を明示
      let text, fmt;
      if (b0 === 0xEF && b1 === 0xBB && b2 === 0xBF) {
        fmt  = 'text(UTF-8 BOM)';
        text = new TextDecoder('utf-8').decode(bytes.slice(3));
      } else if (b0 === 0xFF && b1 === 0xFE) {
        fmt  = 'text(UTF-16 LE)';
        text = new TextDecoder('utf-16le').decode(bytes.slice(2));
      } else if (b0 === 0xFE && b1 === 0xFF) {
        fmt  = 'text(UTF-16 BE)';
        text = new TextDecoder('utf-16be').decode(bytes.slice(2));
      } else {
        // BOM なし → CP932(Shift-JIS) を明示してデコード
        fmt  = 'text(CP932/Shift-JIS)';
        text = new TextDecoder('shift-jis').decode(bytes);
      }
      return { fmt, wb: XLSX.read(text, { type: 'string', cellDates: true }) };
    }

    function processAssetLedger(bytes) {
      const { wb, fmt } = readWorkbook(bytes);
      const wsName = wb.SheetNames[0];
      const ws = wb.Sheets[wsName];

      if (!ws['!ref']) throw new Error('シートにデータがありません。');

      // 1. A列・B列を削除（インデックス 0, 1）
      wsDeleteCols(ws, 0, 1);

      // 2. 1〜4行目を削除（インデックス 0〜3）
      wsDeleteRows(ws, 0, 3);

      // 3. 新A列（元C列）が「勘定設定キー」または空の行を末尾から削除
      //    ヘッダー行（インデックス0）はスキップ
      let range = XLSX.utils.decode_range(ws['!ref']);
      for (let R = range.e.r; R >= 1; R--) {
        const cell = ws[XLSX.utils.encode_cell({ r: R, c: 0 })];
        const v = cell ? (cell.v ?? '') : '';
        if (v === '勘定設定キー' || v === '') {
          wsDeleteRow(ws, R);
        }
      }

      // 4. 新D列（インデックス3）→ 整数フォーマット
      // 5. 新H列（インデックス7）→ 日付フォーマット yyyy/mm/dd
      range = XLSX.utils.decode_range(ws['!ref']);
      for (let R = 1; R <= range.e.r; R++) {
        const dCell = ws[XLSX.utils.encode_cell({ r: R, c: 3 })];
        const hCell = ws[XLSX.utils.encode_cell({ r: R, c: 7 })];
        if (dCell) dCell.z = '0';
        if (hCell) hCell.z = 'yyyy/mm/dd';
      }

      // セル結合情報はクリア（行列削除後は無効になるため）
      delete ws['!merges'];

      // Shift-JIS (CP932) で書き出す → Excel で日本語が正しく表示される
      // xlsx は内部 UTF-8 固定のため、BIFF8 (.xls) 形式を使用する
      wb.Workbook = wb.Workbook || {};
      wb.Workbook.WBProps = wb.Workbook.WBProps || {};
      wb.Workbook.WBProps.CodePage = 932;
      const output = XLSX.write(wb, { type: 'array', bookType: 'biff8' });

      range = XLSX.utils.decode_range(ws['!ref']);
      return { output: new Uint8Array(output), rowCount: range.e.r, fmt };
    }

    // 列削除: startCol〜endCol を削除し、右の列を左にシフト
    function wsDeleteCols(ws, startCol, endCol) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      const numDel = endCol - startCol + 1;

      for (let R = range.s.r; R <= range.e.r; R++) {
        for (let C = startCol; C <= range.e.c; C++) {
          const to = XLSX.utils.encode_cell({ r: R, c: C });
          const srcC = C + numDel;
          if (srcC <= range.e.c) {
            const from = XLSX.utils.encode_cell({ r: R, c: srcC });
            if (ws[from]) ws[to] = ws[from];
            else delete ws[to];
          } else {
            delete ws[to];
          }
        }
      }
      range.e.c -= numDel;
      ws['!ref'] = XLSX.utils.encode_range(range);
      if (ws['!cols']) ws['!cols'].splice(startCol, numDel);
    }

    // 行削除: startRow〜endRow を削除し、下の行を上にシフト
    function wsDeleteRows(ws, startRow, endRow) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      const numDel = endRow - startRow + 1;

      for (let R = startRow; R <= range.e.r; R++) {
        for (let C = range.s.c; C <= range.e.c; C++) {
          const to = XLSX.utils.encode_cell({ r: R, c: C });
          const srcR = R + numDel;
          if (srcR <= range.e.r) {
            const from = XLSX.utils.encode_cell({ r: srcR, c: C });
            if (ws[from]) ws[to] = ws[from];
            else delete ws[to];
          } else {
            delete ws[to];
          }
        }
      }
      range.e.r -= numDel;
      ws['!ref'] = XLSX.utils.encode_range(range);
      if (ws['!rows']) ws['!rows'].splice(startRow, numDel);
    }

    // 1行削除: rowIdx の行を削除し、以下の行を1つ上にシフト
    function wsDeleteRow(ws, rowIdx) {
      const range = XLSX.utils.decode_range(ws['!ref']);

      for (let R = rowIdx; R < range.e.r; R++) {
        for (let C = range.s.c; C <= range.e.c; C++) {
          const to   = XLSX.utils.encode_cell({ r: R,     c: C });
          const from = XLSX.utils.encode_cell({ r: R + 1, c: C });
          if (ws[from]) ws[to] = ws[from];
          else delete ws[to];
        }
      }
      for (let C = range.s.c; C <= range.e.c; C++) {
        delete ws[XLSX.utils.encode_cell({ r: range.e.r, c: C })];
      }
      range.e.r -= 1;
      ws['!ref'] = XLSX.utils.encode_range(range);
    }
  </script>

</body>
</html>
